<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UniFinder — Find Your University</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0e12;--card:#14161d;--border:#1e2130;--border2:#2a2d3e;
  --text:#dbe2ec;--muted:#757f93;--accent:#94a2fb;--accent-dim:rgba(80,74,237,.18);
  --green:#31cd87;--green-dim:rgba(27,174,110,.12);
  --yellow:#f9b31d;--yellow-dim:rgba(240,141,14,.12);
  --red:#f97070;--red-dim:rgba(237,74,74,.12);
  --purple:#c494fb;--purple-dim:rgba(160,74,237,.12);
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
input,select{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px;width:100%;outline:none;font-family:inherit;transition:.15s}
input:focus,select:focus{border-color:var(--accent)}
select option{background:#1a1d2e}
button{font-family:inherit;cursor:pointer;border:none;transition:.15s}
.hidden{display:none!important}

/* ── HEADER ── */
.header{background:linear-gradient(180deg,rgba(80,74,237,.08) 0%,transparent 100%);border-bottom:1px solid var(--border);padding:40px 20px 32px;text-align:center}
.badge{display:inline-block;background:var(--accent-dim);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 12px;border-radius:20px;margin-bottom:14px}
.header h1{font-size:clamp(28px,5vw,52px);font-weight:800;color:#fff;margin-bottom:8px}
.header p{color:var(--muted);font-size:15px;line-height:1.6}

/* ── FORM ── */
.form-wrap{max-width:900px;margin:32px auto;padding:0 20px}
.form-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px}
.form-title{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:20px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.form-row{display:flex;gap:8px}
.form-row input,.form-row select{flex:1}
.eng-score{display:flex;gap:8px;align-items:center}
.eng-score input{width:100px;flex:none}
.eng-score span{font-size:12px;color:var(--muted)}

.checkbox-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip-check{position:relative}
.chip-check input{position:absolute;opacity:0;width:0;height:0}
.chip-check label{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;color:var(--muted)}
.chip-check input:checked+label{background:var(--accent-dim);border-color:var(--accent);color:#fff}

.find-btn{width:100%;margin-top:20px;background:linear-gradient(135deg,#504aed,#7c6ffa);color:#fff;font-size:15px;font-weight:700;padding:14px;border-radius:10px;letter-spacing:.02em}
.find-btn:hover{opacity:.9;transform:translateY(-1px)}

/* ── RESULTS ── */
.results-wrap{max-width:900px;margin:0 auto 60px;padding:0 20px}
.results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.results-count{font-size:14px;color:var(--muted)}
.results-count strong{color:var(--text)}
.sort-row{display:flex;gap:8px;align-items:center}
.sort-row label{font-size:12px;color:var(--muted)}
.sort-row select{width:auto;font-size:12px;padding:6px 10px}

.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.filt-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600}
.filt-btn:hover{border-color:var(--accent);color:var(--accent)}
.filt-btn.active{background:var(--accent-dim);border-color:var(--accent);color:#fff}

/* ── UNI CARD ── */
.uni-card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;transition:.15s}
.uni-card:hover{border-color:var(--border2)}
.card-top{padding:18px 20px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card-left{}
.uni-flag-name{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.uni-flag{font-size:20px}
.uni-name{font-size:17px;font-weight:700;color:#fff}
.uni-name a{color:#fff}
.uni-name a:hover{color:var(--accent);text-decoration:none}
.uni-loc{font-size:12px;color:var(--muted);margin-bottom:8px}
.match-bar{display:flex;align-items:center;gap:8px}
.match-label{font-size:11px;color:var(--muted)}
.match-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.match-high{background:var(--green-dim);color:var(--green)}
.match-mid{background:var(--yellow-dim);color:var(--yellow)}
.match-low{background:var(--red-dim);color:var(--red)}

.card-right{text-align:right;min-width:120px}
.tuition-val{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:2px}
.tuition-note{font-size:11px;color:var(--muted);margin-bottom:6px}
.acceptance{font-size:12px;color:var(--muted)}
.acceptance strong{color:var(--text)}

.card-meta{padding:0 20px 14px;display:flex;gap:6px;flex-wrap:wrap}
.meta-chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px}
.mc-green{background:var(--green-dim);color:var(--green)}
.mc-yellow{background:var(--yellow-dim);color:var(--yellow)}
.mc-red{background:var(--red-dim);color:var(--red)}
.mc-blue{background:var(--accent-dim);color:var(--accent)}
.mc-gray{background:rgba(117,127,147,.1);color:var(--muted)}
.mc-purple{background:var(--purple-dim);color:var(--purple)}

.card-reqs{padding:0 20px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.req-row{display:flex;align-items:flex-start;gap:7px;font-size:12px}
.req-icon{font-size:13px;margin-top:1px;flex-shrink:0}
.req-content{}
.req-title{font-weight:700;color:var(--text);margin-bottom:1px}
.req-val{color:var(--muted);line-height:1.4}

.card-expand-btn{width:100%;background:none;border-top:1px solid var(--border);padding:10px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.card-expand-btn:hover{background:rgba(255,255,255,.02);color:var(--text)}

.card-detail{padding:16px 20px;border-top:1px solid var(--border);background:rgba(0,0,0,.2)}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:14px}
.detail-item .dl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.detail-item .dv{font-size:13px;color:var(--text);line-height:1.5}
.detail-note{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:14px;padding:12px;background:rgba(255,255,255,.02);border-radius:8px;border:1px solid var(--border)}
.card-links{display:flex;gap:8px;flex-wrap:wrap}
.link-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;border:1px solid}
.link-primary{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.link-primary:hover{background:rgba(80,74,237,.3);text-decoration:none}
.link-secondary{background:transparent;border-color:var(--border2);color:var(--muted)}
.link-secondary:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}

.no-results{text-align:center;padding:60px 20px;color:var(--muted)}
.no-results .icon{font-size:48px;margin-bottom:16px}
.no-results h3{font-size:18px;color:var(--text);margin-bottom:8px}

/* ── MISC ── */
.section-divider{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px;padding:0 2px;display:flex;align-items:center;gap:10px}
.section-divider::after{content:'';flex:1;height:1px;background:var(--border)}
</style>
</head>
<body>

<div class="header">
  <div class="badge">🎓 2025 / 26 INTAKE — BACHELORS</div>
  <h1>UniFinder</h1>
  <p>Tell us your profile. We'll find the best universities for you.<br>Bachelors only · Worldwide · International student requirements included</p>
</div>

<div class="form-wrap">
  <div class="form-card">
    <div class="form-title">Your Profile</div>
    <div class="form-grid">

      <div class="form-group" style="grid-column:span 2">
        <label>Field of Study</label>
        <select id="f-field">
          <option value="cs">Computer Science / Software Engineering</option>
          <option value="engineering">Engineering (Civil / Electrical / Mechanical)</option>
          <option value="business">Business / Management / Finance</option>
          <option value="medicine">Medicine / Pharmacy</option>
          <option value="architecture">Architecture / Design</option>
          <option value="law">Law</option>
          <option value="any">Open to Anything</option>
        </select>
      </div>

      <div class="form-group">
        <label>High School Grades</label>
        <select id="f-grades">
          <option value="excellent">Excellent (A / A+ / 80%+)</option>
          <option value="good">Good (B / 65–80%)</option>
          <option value="average" selected>Average (C / 50–65%)</option>
          <option value="below">Below Average (&lt;50%)</option>
        </select>
      </div>

      <div class="form-group">
        <label>SAT</label>
        <select id="f-sat">
          <option value="none" selected>Not taken</option>
          <option value="below1200">Taken — below 1200</option>
          <option value="1200">Taken — 1200–1400</option>
          <option value="1400">Taken — 1400+</option>
        </select>
      </div>

      <div class="form-group">
        <label>English Proficiency Test</label>
        <select id="f-eng-type" onchange="updateEngScore()">
          <option value="none">None / Not taken yet</option>
          <option value="ielts">IELTS</option>
          <option value="toefl">TOEFL iBT</option>
          <option value="duolingo">Duolingo English Test</option>
          <option value="pte">PTE Academic</option>
          <option value="native">Native / School in English</option>
        </select>
      </div>

      <div class="form-group" id="eng-score-group" style="display:none">
        <label>Your Score</label>
        <input type="number" id="f-eng-score" placeholder="e.g. 6.5" step="0.5"/>
      </div>

      <div class="form-group">
        <label>Budget (Tuition per year, USD)</label>
        <select id="f-budget">
          <option value="999999" selected>Any budget — show all</option>
          <option value="3000">Under $3,000</option>
          <option value="8000">$3,000 – $8,000</option>
          <option value="15000">$8,000 – $15,000</option>
          <option value="25000">$15,000 – $25,000</option>
          <option value="35000">$25,000 – $35,000</option>
          <option value="50000">$35,000+</option>
        </select>
      </div>

      <div class="form-group" style="grid-column:1/-1">
        <label>Preferred Regions (select all that interest you)</label>
        <div class="checkbox-group">
          <div class="chip-check"><input type="checkbox" id="r-europe" value="europe" checked><label for="r-europe">🇪🇺 Europe</label></div>
          <div class="chip-check"><input type="checkbox" id="r-middleeast" value="middleeast" checked><label for="r-middleeast">🕌 Middle East</label></div>
          <div class="chip-check"><input type="checkbox" id="r-saudi" value="saudi" checked><label for="r-saudi">🇸🇦 Saudi Arabia</label></div>
          <div class="chip-check"><input type="checkbox" id="r-aus" value="aus" checked><label for="r-aus">🇦🇺 Australia</label></div>
          <div class="chip-check"><input type="checkbox" id="r-nz" value="nz" checked><label for="r-nz">🇳🇿 New Zealand</label></div>
          <div class="chip-check"><input type="checkbox" id="r-canada" value="canada" checked><label for="r-canada">🇨🇦 Canada</label></div>
          <div class="chip-check"><input type="checkbox" id="r-uk" value="uk" checked><label for="r-uk">🇬🇧 UK</label></div>
          <div class="chip-check"><input type="checkbox" id="r-malaysia" value="malaysia" checked><label for="r-malaysia">🇲🇾 Malaysia</label></div>
        </div>
      </div>

    </div>
    <button class="find-btn" onclick="findUnis()">🔍 Find My Universities</button>
  </div>
</div>

<div class="results-wrap" id="results-section" style="display:none">
  <div class="results-header">
    <div class="results-count">Showing <strong id="res-count">0</strong> universities matching your profile</div>
    <div class="sort-row">
      <label>Sort by</label>
      <select id="sort-by" onchange="renderResults()">
        <option value="match">Best Match</option>
        <option value="tuition">Lowest Tuition</option>
        <option value="acceptance">Highest Acceptance</option>
        <option value="visa">Easiest Visa</option>
      </select>
    </div>
  </div>
  <div class="filter-bar" id="region-filters"></div>
  <div id="uni-list"></div>
</div>

// ══════════════════════════════════════════
//  APP LOGIC
// ══════════════════════════════════════════

let userProfile = {};
let filteredUnis = [];
let activeRegion = 'all';

function updateEngScore() {
  const t = document.getElementById('f-eng-type').value;
  const grp = document.getElementById('eng-score-group');
  if (t === 'none' || t === 'native') {
    grp.style.display = 'none';
  } else {
    grp.style.display = '';
    const placeholders = {ielts:'e.g. 6.5',toefl:'e.g. 80',duolingo:'e.g. 105',pte:'e.g. 55'};
    document.getElementById('f-eng-score').placeholder = placeholders[t] || 'Score';
  }
}

function getSelectedRegions() {
  return Array.from(document.querySelectorAll('.chip-check input:checked')).map(c => c.value);
}

// Budget max in USD
const BUDGET_MAP = {3000:3000, 8000:8000, 15000:15000, 25000:25000, 999999:999999};

function budgetMax() {
  return parseInt(document.getElementById('f-budget').value);
}

function scoreUni(uni, profile) {
  let score = 0, maxScore = 0;

  // Region match (required)
  if (!profile.regions.includes(uni.region)) return -1;

  // Program match (required)
  if (!uni.programs.includes(profile.field) && profile.field !== 'any') return -1;

  // Budget — never hide, just score lower if over budget
  maxScore += 25;
  if (uni.tuitionUSD <= profile.budgetMax) score += 25;
  else if (uni.tuitionUSD <= profile.budgetMax * 1.5) score += 10;
  // over budget: score 0 but still show

  // English requirement
  maxScore += 30;
  if (profile.engType === 'native') {
    score += 30;
  } else if (profile.engType === 'none') {
    // No test taken — check if uni allows no test
    if (!uni.engReq.ielts) score += 25;
    else score += 5;
  } else {
    const userScore = profile.engScore;
    const reqScore = uni.engReq[profile.engType];
    if (!reqScore) {
      // Uni doesn't accept this test type
      score += 5;
    } else if (userScore >= reqScore) {
      score += 30;
    } else if (userScore >= reqScore - 0.5) {
      score += 15;
    } else {
      score += 0;
    }
  }

  // Grades
  maxScore += 25;
  const gradeScore = {excellent:25, good:20, average:12, below:5};
  score += gradeScore[profile.grades] || 10;

  // SAT
  maxScore += 10;
  if (!uni.satRequired || profile.sat !== 'none') score += 10;
  else score += 5;

  // Visa bonus
  maxScore += 10;
  if (uni.visaDifficulty === 'easy') score += 10;
  else if (uni.visaDifficulty === 'moderate') score += 6;
  else score += 2;

  return Math.round((score / maxScore) * 100);
}

function findUnis() {
  userProfile = {
    field: document.getElementById('f-field').value,
    grades: document.getElementById('f-grades').value,
    sat: document.getElementById('f-sat').value,
    engType: document.getElementById('f-eng-type').value,
    engScore: parseFloat(document.getElementById('f-eng-score').value) || 0,
    budgetMax: budgetMax(),
    regions: getSelectedRegions(),
  };

  filteredUnis = UNIS.map(u => ({...u, matchScore: scoreUni(u, userProfile)}))
    .filter(u => u.matchScore >= 0)
    .sort((a,b) => b.matchScore - a.matchScore);

  activeRegion = 'all';
  renderResults();

  document.getElementById('results-section').style.display = '';
  setTimeout(() => document.getElementById('results-section').scrollIntoView({behavior:'smooth'}), 100);
}

function renderResults() {
  const sortBy = document.getElementById('sort-by').value;
  let unis = [...filteredUnis];

  if (sortBy === 'tuition') unis.sort((a,b) => a.tuitionUSD - b.tuitionUSD);
  else if (sortBy === 'acceptance') unis.sort((a,b) => b.acceptance - a.acceptance);
  else if (sortBy === 'visa') unis.sort((a,b) => {
    const v = {easy:0,moderate:1,hard:2};
    return v[a.visaDifficulty] - v[b.visaDifficulty];
  });
  else unis.sort((a,b) => b.matchScore - a.matchScore);

  const visible = activeRegion === 'all' ? unis : unis.filter(u => u.region === activeRegion);

  // Filter bar
  const regionLabels = {all:'🌍 All', europe:'🇪🇺 Europe', saudi:'🇸🇦 Saudi', middleeast:'🕌 Middle East', aus:'🇦🇺 Australia', nz:'🇳🇿 New Zealand', canada:'🇨🇦 Canada', uk:'🇬🇧 UK', malaysia:'🇲🇾 Malaysia'};
  const regions = ['all',...new Set(filteredUnis.map(u => u.region))];
  document.getElementById('region-filters').innerHTML = regions.map(r =>
    `<button class="filt-btn ${activeRegion===r?'active':''}" onclick="setRegion('${r}')">${regionLabels[r]||r} <span style="opacity:.6;font-size:10px">${r==='all'?filteredUnis.length:filteredUnis.filter(u=>u.region===r).length}</span></button>`
  ).join('');

  document.getElementById('res-count').textContent = visible.length;

  if (!visible.length) {
    document.getElementById('uni-list').innerHTML = `<div class="no-results"><div class="icon">🔍</div><h3>No matches found</h3><p>Try expanding your budget, regions, or relaxing requirements.</p></div>`;
    return;
  }

  document.getElementById('uni-list').innerHTML = visible.map(u => renderCard(u)).join('');
}

function setRegion(r) {
  activeRegion = r;
  renderResults();
}

function getDuration(uni, field) {
  return uni.duration[field] || uni.duration[Object.keys(uni.duration)[0]];
}

function renderCard(u) {
  const p = userProfile;
  const match = u.matchScore;
  const matchClass = match >= 75 ? 'match-high' : match >= 50 ? 'match-mid' : 'match-low';
  const matchLabel = match >= 75 ? '✓ Strong Match' : match >= 50 ? '~ Partial Match' : '⚠ Weak Match';

  const visaChipClass = u.visaDifficulty === 'easy' ? 'mc-green' : u.visaDifficulty === 'moderate' ? 'mc-yellow' : 'mc-red';
  const visaLabel = u.visaDifficulty === 'easy' ? '🟢 Visa: Easy' : u.visaDifficulty === 'moderate' ? '🟡 Visa: Moderate' : '🔴 Visa: Hard';

  // English req check
  let engChip = '';
  if (p.engType === 'native') {
    engChip = `<span class="meta-chip mc-green">✓ English: Native</span>`;
  } else if (p.engType === 'none') {
    engChip = u.engReq.ielts ? `<span class="meta-chip mc-yellow">⚠ English test needed</span>` : `<span class="meta-chip mc-green">✓ No English test</span>`;
  } else {
    const req = u.engReq[p.engType];
    if (!req) {
      engChip = `<span class="meta-chip mc-red">✗ ${p.engType.toUpperCase()} not accepted</span>`;
    } else if (p.engScore >= req) {
      engChip = `<span class="meta-chip mc-green">✓ ${p.engType.toUpperCase()} ${p.engScore} ≥ ${req}</span>`;
    } else {
      engChip = `<span class="meta-chip mc-red">✗ Need ${p.engType.toUpperCase()} ${req} (have ${p.engScore})</span>`;
    }
  }

  const field = p.field === 'any' ? Object.keys(u.duration)[0] : p.field;
  const yrs = getDuration(u, field);

  return `
  <div class="uni-card" id="card-${u.id}">
    <div class="card-top">
      <div class="card-left">
        <div class="uni-flag-name">
          <span class="uni-flag">${u.flag}</span>
          <div class="uni-name"><a href="${u.website}" target="_blank">${u.name}</a></div>
        </div>
        <div class="uni-loc">📍 ${u.city}, ${u.country}</div>
        <div class="match-bar">
          <span class="match-pill ${matchClass}">${matchLabel} — ${match}%</span>
        </div>
      </div>
      <div class="card-right">
        <div class="tuition-val">${u.tuitionLabel}</div>
        <div class="tuition-note">${u.tuitionNote||'per year'}</div>
        <div class="acceptance">Acceptance <strong>~${u.acceptance}%</strong></div>
      </div>
    </div>

    <div class="card-meta">
      <span class="meta-chip ${visaChipClass}">${visaLabel}</span>
      <span class="meta-chip mc-blue">📅 ${u.deadlines}</span>
      <span class="meta-chip mc-gray">📚 ${yrs} years</span>
      <span class="meta-chip mc-gray">🗓 Starts: ${u.termStart.join(' / ')}</span>
      ${engChip}
      ${u.satRequired ? `<span class="meta-chip mc-yellow">SAT Required</span>` : `<span class="meta-chip mc-green">✓ No SAT</span>`}
      ${u.tuitionUSD > p.budgetMax ? `<span class="meta-chip mc-red">⚠ Over your budget</span>` : ''}
    </div>

    <button class="card-expand-btn" onclick="toggleDetail('${u.id}')">▼ SHOW FULL DETAILS</button>

    <div class="card-detail hidden" id="detail-${u.id}">
      <div class="detail-grid">
        <div class="detail-item">
          <div class="dl">Visa Process</div>
          <div class="dv">${u.visaNote}</div>
        </div>
        <div class="detail-item">
          <div class="dl">English Requirements</div>
          <div class="dv">IELTS ${u.engReq.ielts||'—'} · TOEFL ${u.engReq.toefl||'—'} · Duolingo ${u.engReq.duolingo||'Not accepted'} · PTE ${u.engReq.pte||'—'}<br><em style="color:var(--muted)">${u.engNote}</em></div>
        </div>
        <div class="detail-item">
          <div class="dl">Transcripts / Grades</div>
          <div class="dv">${u.gradesNote}</div>
        </div>
        <div class="detail-item">
          <div class="dl">For International Students</div>
          <div class="dv">${u.intlNote}</div>
        </div>
        <div class="detail-item">
          <div class="dl">Scholarships</div>
          <div class="dv">${u.scholarships}</div>
        </div>
        <div class="detail-item">
          <div class="dl">Programs Available</div>
          <div class="dv">${u.programs.map(p => ({cs:'CS / Software Eng',engineering:'Engineering',business:'Business / Finance',medicine:'Medicine / Pharmacy',architecture:'Architecture',law:'Law'}[p]||p)).join('<br>')}</div>
        </div>
      </div>
      ${u.highlights.length ? `<div class="detail-note">⭐ <strong>Why it fits:</strong> ${u.highlights.join(' · ')}</div>` : ''}
      <div class="card-links">
        <a href="${u.applyLink}" target="_blank" class="link-btn link-primary">📝 Apply Now</a>
        <a href="${u.website}" target="_blank" class="link-btn link-secondary">🌐 University Website</a>
      </div>
    </div>
  </div>`;
}

function toggleDetail(id) {
  const el = document.getElementById('detail-'+id);
  const btn = el.previousElementSibling;
  if (el.classList.contains('hidden')) {
    el.classList.remove('hidden');
    btn.textContent = '▲ HIDE DETAILS';
  } else {
    el.classList.add('hidden');
    btn.textContent = '▼ SHOW FULL DETAILS';
  }
}
</script>
